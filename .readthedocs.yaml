# Read the Docs configuration for s1swotcolocs.
#
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.
#
# This builds the Sphinx documentation in docs/ with the Read-the-Docs theme.
# The notebooks in docs/notebooks are executed by nbsphinx at build time
# (they ship no pre-saved outputs); they only import packages that are
# either installed by `pip install .` (the project itself) or listed in
# docs/requirements.txt.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

python:
  install:
    # Install the project itself so that `import s1swotcolocs` in
    # docs/conf.py and in the notebooks resolves. This pulls every runtime
    # dependency declared in pyproject.toml from PyPI.
    - method: pip
      path: .
    # Documentation-only dependencies (theme + notebook tooling + plotting).
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  # Do not turn warnings (e.g. autodoc resolution notices) into build failures.
  fail_on_warning: false

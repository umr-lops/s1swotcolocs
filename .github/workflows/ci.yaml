name: CI

on:
    push:
        branches: [develop]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    detect-skip-ci-trigger:
        name: "Detect CI Trigger: [skip-ci]"
        if: |
            github.repository == 'umr-lops/s1swotcolocs'
            && (
              github.event_name == 'push' || github.event_name == 'pull_request'
            )
        runs-on: ubuntu-latest
        outputs:
            triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 2
            - uses: xarray-contrib/ci-trigger@v1
              id: detect-trigger
              with:
                  keyword: "[skip-ci]"

    ci:
        name: ${{ matrix.os }} py${{ matrix.python-version }}
        runs-on: ${{ matrix.os }}
        needs: detect-skip-ci-trigger

        if: needs.detect-skip-ci-trigger.outputs.triggered == 'false'

        defaults:
            run:
                shell: bash -l {0}

        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.13"]
                os: ["ubuntu-latest"]

        steps:
            - name: Checkout the repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup environment variables
              run: |
                  echo "TODAY=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
                  echo "CONDA_ENV_FILE=ci/requirements/environment.yaml" >> $GITHUB_ENV

            - name: Setup micromamba
              uses: mamba-org/setup-micromamba@v2
              with:
                  environment-file: ${{ env.CONDA_ENV_FILE }}
                  environment-name: s1swotcolocs-tests
                  cache-environment: true
                  cache-environment-key: >
                      ${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ env.TODAY }}-${{ hashFiles(env.CONDA_ENV_FILE) }}
                  create-args: >-
                      python=${{ matrix.python-version }}

            - name: Install private dependencies (s1ifr)
              run: |
                  pip install s1ifr \
                  --index-url https://gitlab-ci-token:${{ secrets.CI_JOB_TOKEN }}@gitlab.ifremer.fr/api/v4/projects/4991/packages/pypi/simple
              shell: bash -el {0}
            # - name: Install private dependencies (s1ifr)
            #   run: |
            #       # We do this here because we can explicitly pass the token and URL
            #       python -m pip install s1ifr --extra-index-url https://__token__:${{ secrets.CI_JOB_TOKEN }}@gitlab.ifremer.fr/api/v4/projects/4991/packages/pypi/simple
            #   shell: bash -el {0}

            - name: Install s1swotcolocs
              run: |
                  python -m pip install --no-deps -e .
              shell: bash -el {0}
